name: Frontend

# Called by ci.yml, which runs it once per change (pull requests and pushes to main) and owns
# the concurrency group. It can also be dispatched by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json # version comes from `packageManager`
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend lint
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend build
      # The typed API client is generated from the OpenAPI contract; fail when they diverge.
      - name: Generated API client is up to date
        run: |
          pnpm --dir frontend exec openapi-typescript \
            ../specs/001-nutrition-recipe-planner/contracts/openapi.yaml \
            --output src/app/api/generated/schema.ts
          git diff --exit-code -- frontend/src/app/api/generated/schema.ts

  unit:
    name: Unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # diff-cover compares against the base branch
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # Thresholds live in frontend/vite.config.ts and fail this step when coverage regresses.
      - run: pnpm --dir frontend test:coverage
      - name: Coverage floor headroom
        continue-on-error: true
        run: python3 scripts/coverage-ratchet.py

      - name: Summarise coverage
        if: always()
        run: |
          # shellcheck disable=SC2016 # the backticks are JavaScript template literals, not shell
          [ -f frontend/coverage/coverage-summary.json ] && node -e '
            const t = require("./frontend/coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Frontend coverage", "", "| Metric | Covered | Count |", "| --- | --- | --- |",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY" || true
      # Lines this pull request changes should be covered. Vitest only measures unit tests, so UI
      # handlers that Playwright exercises show up as uncovered; until browser coverage is merged
      # in, the result is reported on the run page and as a warning instead of failing the check.
      # Set FRONTEND_DIFF_COVERAGE_BLOCKING to "true" to make it a gate.
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: github.event_name == 'pull_request'
      - name: Report coverage on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }} # via env, never interpolated into the script
          FRONTEND_DIFF_COVERAGE_BLOCKING: "false"
        run: |
          # lcov paths are relative to frontend/; diff-cover expects repo-relative ones.
          sed 's#^SF:#SF:frontend/#' frontend/coverage/lcov.info > "$RUNNER_TEMP/lcov.info"
          status=0
          uvx diff-cover "$RUNNER_TEMP/lcov.info" \
            --compare-branch="origin/$BASE_REF" \
            --include "frontend/src/**" \
            --fail-under=85 \
            --markdown-report diff-coverage.md || status=$?
          { echo "### Frontend coverage on changed lines"; cat diff-coverage.md; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            if [ "$FRONTEND_DIFF_COVERAGE_BLOCKING" = "true" ]; then exit "$status"; fi
            echo "::warning title=Frontend changed-line coverage::Under 85% of the changed frontend lines are covered by unit tests. See the run summary; e2e-only coverage is not counted."
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage
          retention-days: 14
          if-no-files-found: ignore

  # The mocked-API suite is the slowest lane, so it is split across two runners. Playwright
  # shards by test, so each shard runs about half of every project.
  e2e:
    name: End-to-end (Chromium ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false # a failure in one shard must not hide results from the other
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build # Playwright serves this bundle with `vite preview`

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm --dir frontend exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Install system libraries only
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --dir frontend exec playwright install-deps chromium

      # Screenshots are rendered per platform. Until Linux baselines are committed (see
      # frontend/e2e/README.md) the behavioural checks still run and gate the change; the
      # pixel comparison switches on automatically as soon as `-linux.png` baselines exist.
      - name: Decide whether visual baselines exist
        id: visual
        run: |
          if find frontend/e2e/__screenshots__ -name '*-linux.png' -print -quit | grep -q .; then
            echo "ignore=0" >> "$GITHUB_OUTPUT"
          else
            echo "ignore=1" >> "$GITHUB_OUTPUT"
            echo "::warning title=Visual baselines::No Linux screenshot baselines are committed, so pixel comparisons were skipped. Run the 'Update visual baselines' workflow."
          fi
      - run: >-
          pnpm --dir frontend exec playwright test
          --project=desktop-chromium --project=narrow-mobile --shard=${{ matrix.shard }}/2
        env:
          PLAYWRIGHT_IGNORE_SNAPSHOTS: ${{ steps.visual.outputs.ignore }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-chromium-${{ matrix.shard }}
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # Safari compatibility is checked on its own so a WebKit-only failure is clearly labelled
  # and does not hide the Chromium results.
  e2e-webkit:
    name: End-to-end (WebKit native select)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps webkit
      - run: pnpm --dir frontend exec playwright test --project=webkit-native-select
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-webkit
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
