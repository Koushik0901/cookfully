name: Dependency audit

# Advisory databases change daily, so audits live apart from the build and test workflows: a
# newly published advisory must not block an unrelated change.
#   * pull requests and pushes that touch a manifest or lockfile are gated on *production*
#     dependencies, the ones that ship in the images (ci.yml decides when to call this);
#   * a daily run audits everything, development tooling included, and reports it.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  workflow_call: # ci.yml calls this when a manifest or lockfile changes

permissions:
  contents: read

jobs:
  python:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: uv export --project backend --locked --all-extras --no-dev --no-hashes --no-emit-project --output-file "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --strict

  node:
    name: Node production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend audit --prod --audit-level high

  node-dev-tooling:
    name: Node development tooling (report only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      # Build-time tooling never ships, so findings here inform Dependabot rather than gate
      # changes. They are listed in the run summary for triage.
      - name: Audit everything
        run: |
          {
            echo "### pnpm audit (all dependencies)"
            echo '```'
            pnpm --dir frontend audit --audit-level high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
