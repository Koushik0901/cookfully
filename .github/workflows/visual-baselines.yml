name: Update visual baselines

# Visual baselines must be rendered where they are checked. CI renders on Linux, so the
# committed screenshots are produced here, not on a developer machine.
#
# Run it from the Actions tab (workflow_dispatch), or push a branch named
# `visual-baselines/<anything>`. It uploads the regenerated images as the
# `visual-baselines` artifact; download it, review the images, and commit them:
#
#   gh run download <run-id> --name visual-baselines --dir frontend/e2e/__screenshots__
on:
  workflow_dispatch:
  push:
    branches: ["visual-baselines/**"]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend exec playwright install --with-deps chromium webkit
      # Tests that fail for non-screenshot reasons still fail the step; the images that
      # were produced are uploaded regardless so they can be reviewed.
      - run: pnpm --dir frontend e2e:visual:update
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: frontend/e2e/__screenshots__
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
