name: Update visual baselines

# Screenshots are rendered per operating system, and CI runs on Linux, so the committed
# `-linux.png` baselines must be produced here rather than on a developer machine.
#
# Run it from the Actions tab on the branch whose UI changed. It regenerates the Linux
# baselines and commits them back to that branch. Review the images in the commit before
# merging: a changed baseline is an intentional UI change.
on:
  workflow_dispatch:

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # commit the regenerated images to the branch

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
      - run: pnpm --dir frontend exec playwright install --with-deps chromium webkit
      - name: Regenerate Linux baselines
        run: pnpm --dir frontend exec playwright test --update-snapshots --retries=0
        env:
          CI: "true"
      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date."
          else
            git commit -m "test: update Linux visual baselines"
            git push
          fi
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
