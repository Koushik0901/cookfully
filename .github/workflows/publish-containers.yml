name: Publish containers

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  # Images are only published for a commit that is on main and passed CI there. Without this,
  # pushing a `v*.*.*` tag from any branch would publish untested code.
  verify:
    name: Verify the release commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main. Merge it first, then tag main."
            exit 1
          fi
      - name: CI passed on that commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # `ci-ok` is the aggregate check from ci.yml. Pushes to main always run the full suite,
          # so a result exists; give a run that is still finishing a few minutes to land.
          for attempt in $(seq 1 20); do
            conclusion=$(gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?check_name=ci-ok" \
              --jq '[.check_runs[] | select(.status == "completed")] | sort_by(.completed_at) | last | .conclusion // empty')
            case "$conclusion" in
              success) echo "ci-ok passed for $GITHUB_SHA."; exit 0 ;;
              "") echo "No finished ci-ok result yet (attempt $attempt/20)."; sleep 30 ;;
              *) echo "::error::ci-ok concluded '$conclusion' for $GITHUB_SHA; refusing to publish."; exit 1 ;;
            esac
          done
          echo "::error::No ci-ok result for $GITHUB_SHA. Run CI on main for this commit first."
          exit 1

  publish:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cookfully-api
            dockerfile: deploy/docker/backend.Dockerfile
          - image: cookfully-web
            dockerfile: deploy/docker/web.Dockerfile
          - image: cookfully-intelligence
            dockerfile: deploy/docker/intelligence.Dockerfile
          - image: cookfully-backup
            dockerfile: deploy/docker/backup.Dockerfile

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image namespace
        id: namespace
        shell: bash
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.namespace.outputs.value }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
