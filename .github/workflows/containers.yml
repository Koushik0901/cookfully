name: Containers

# Images are only published when a release tag is pushed, so without this check a broken
# Dockerfile or compose file would first surface during a release.
on:
  workflow_call: # ci.yml calls this when deploy files, a lockfile or this workflow changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    name: Compose files are valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Base stack
        run: docker compose --env-file .env.example -f deploy/compose.yaml config --quiet
      - name: Production overlay
        env:
          COOKFULLY_COOKIE_SECURE: "true"
          COOKFULLY_PUBLIC_BASE_URL: https://planner.example.test
          COOKFULLY_API_BASE_URL: https://planner.example.test
          COOKFULLY_TRUSTED_PROXY_CIDRS: 172.31.250.10/32
        run: docker compose --env-file .env.example -f deploy/compose.yaml -f deploy/compose.production.yaml config --quiet

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cookfully-api
            dockerfile: deploy/docker/backend.Dockerfile
          - image: cookfully-web
            dockerfile: deploy/docker/web.Dockerfile
          - image: cookfully-intelligence
            dockerfile: deploy/docker/intelligence.Dockerfile
          - image: cookfully-backup
            dockerfile: deploy/docker/backup.Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
