name: Backend

# Called by ci.yml, which runs it once per change (pull requests and pushes to main) and owns
# the concurrency group. It can also be dispatched by hand from the Actions tab.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_FROZEN: "1" # never let CI rewrite uv.lock

jobs:
  # Independent of the database, so style and type failures surface in about a minute
  # instead of waiting behind (or hiding) the test suite.
  static:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --all-extras --dev
      # mypy re-checks only what changed when its cache is restored (a cold run re-checks every module).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: backend/.mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-${{ github.sha }}
          restore-keys: mypy-${{ runner.os }}-${{ hashFiles('backend/uv.lock') }}-
      - run: uv run --directory backend ruff format --check .
      - run: uv run --directory backend ruff check --output-format=github .
      - run: uv run --directory backend mypy src

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # The image deploy/compose.yaml runs. Migrations need the vchord extension and the
        # tests need pgvector; stock postgres images ship neither.
        image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1
        env:
          POSTGRES_DB: cookfully_test
          POSTGRES_USER: cookfully
          POSTGRES_PASSWORD: cookfully
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cookfully -d cookfully_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      COOKFULLY_ENVIRONMENT: test
      COOKFULLY_DATABASE_URL: postgresql+psycopg://cookfully:cookfully@localhost:5432/cookfully_test
      COOKFULLY_REDIS_URL: redis://localhost:6379/0
      COOKFULLY_SECRET_KEY: test-only-secret-key-with-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0 # diff-cover compares against the base branch
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --project backend --all-extras --dev

      # The total must stay above `fail_under` in backend/pyproject.toml. Tests isolate themselves
      # in per-test database schemas, so they run on every vCPU of the runner; a hung test fails
      # after 60 s (`timeout` in pyproject.toml) instead of stalling the job.
      - name: Run tests with coverage
        env:
          # Property tests replay the same examples on pull requests (so a rare random failure
          # cannot block unrelated work) and explore fresh ones on pushes to main.
          HYPOTHESIS_PROFILE: ${{ github.event_name == 'pull_request' && 'ci' || 'default' }}
        run: >-
          uv run --directory backend pytest
          -n 4
          --hypothesis-profile="$HYPOTHESIS_PROFILE"
          --cov --cov-report=term-missing:skip-covered --cov-report=xml
          --durations=15

      # Notices when the measured total is well above its floor, so the floor gets raised.
      - name: Coverage floor headroom
        continue-on-error: true
        run: python3 scripts/coverage-ratchet.py

      - name: Summarise coverage
        if: always()
        run: |
          {
            echo "### Backend coverage"
            echo
            uv run --directory backend coverage report --format=markdown --skip-covered --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY" || true

      # Total coverage can hide an untested change in a large codebase, so lines touched by the
      # pull request are held to a higher bar than the overall ratchet.
      - name: Require coverage on changed lines
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }} # via env, never interpolated into the script
        run: |
          # coverage.xml paths are relative to backend/; diff-cover expects repo-relative ones.
          sed -i 's#filename="#filename="backend/#' backend/coverage.xml
          uvx diff-cover backend/coverage.xml \
            --compare-branch="origin/$BASE_REF" \
            --include "backend/src/**" \
            --fail-under=85 \
            --markdown-report diff-coverage.md
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14
          if-no-files-found: ignore
