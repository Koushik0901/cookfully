services:
  postgres:
    cpuset: "0-3"

  redis:
    cpuset: "0-3"

  api:
    cpuset: "0-3"

  worker:
    cpuset: "0-3"

  outbox:
    cpuset: "0-3"

  retention:
    cpuset: "0-3"

  benchmark:
    profiles: ["performance"]
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
      target: test
    cpuset: "0-3"
    environment:
      COOKFULLY_ENVIRONMENT: test
      COOKFULLY_SECRET_KEY: ${COOKFULLY_SECRET_KEY:?Set COOKFULLY_SECRET_KEY in .env}
      COOKFULLY_OWNER_EMAIL: performance@example.com
      COOKFULLY_OWNER_BOOTSTRAP_PASSWORD: ${COOKFULLY_OWNER_BOOTSTRAP_PASSWORD:?Set COOKFULLY_OWNER_BOOTSTRAP_PASSWORD in .env}
      COOKFULLY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cookfully}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cookfully}
      COOKFULLY_REDIS_URL: redis://redis:6379/0
      COOKFULLY_MEDIA_ROOT: /tmp/cookfully-performance/media
      COOKFULLY_EXPORT_ROOT: /tmp/cookfully-performance/exports
      COOKFULLY_ERASURE_LEDGER_ROOT: /tmp/cookfully-performance/ledger
      COOKFULLY_REFERENCE_PROFILE: "1"
      COOKFULLY_REFERENCE_STORAGE: ssd
      COOKFULLY_PERFORMANCE_REPORT: ${COOKFULLY_PERFORMANCE_REPORT_CONTAINER:-/app/artifacts/performance-report.json}
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ../artifacts:/app/artifacts
    command:
      - pytest
      - tests/performance/test_reference_profile.py
      - -q
      - -s
