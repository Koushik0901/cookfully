services:
  postgres:
    ports: !reset []
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  redis:
    ports: !reset []
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  intelligence:
    security_opt: ["no-new-privileges:true"]
    networks: [intelligence-net]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - intelligence-model-data:/models

  api:
    environment:
      COOKFULLY_ENVIRONMENT: production
    command:
      - uvicorn
      - cookfully.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${COOKFULLY_TRUSTED_PROXY_CIDRS:?Set COOKFULLY_TRUSTED_PROXY_CIDRS to the web proxy CIDR}
    security_opt: ["no-new-privileges:true"]
    networks: [backend, intelligence-net, proxy]

  worker:
    security_opt: ["no-new-privileges:true"]
    networks: [backend, intelligence-net]

  outbox:
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  retention:
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  web:
    ports: !override
      - "127.0.0.1:${COOKFULLY_HTTP_PORT:-8080}:8080"
    security_opt: ["no-new-privileges:true"]
    networks:
      proxy:
        ipv4_address: ${COOKFULLY_WEB_PROXY_IP:-172.31.250.10}

networks:
  backend: {}
  intelligence-net:
    internal: true
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${COOKFULLY_PROXY_SUBNET:-172.31.250.0/24}
