services:
  postgres:
    ports: !reset []
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  redis:
    ports: !reset []
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  api:
    environment:
      VV_ENVIRONMENT: production
    command:
      - uvicorn
      - vigor_vine.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${VV_TRUSTED_PROXY_CIDRS:?Set VV_TRUSTED_PROXY_CIDRS to the web proxy CIDR}
    security_opt: ["no-new-privileges:true"]
    networks: [backend, proxy]

  worker:
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  outbox:
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  retention:
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  web:
    ports: !override
      - "127.0.0.1:${VV_HTTP_PORT:-8080}:8080"
    security_opt: ["no-new-privileges:true"]
    networks:
      proxy:
        ipv4_address: ${VV_WEB_PROXY_IP:-172.31.250.10}

networks:
  backend: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${VV_PROXY_SUBNET:-172.31.250.0/24}
