name: cookfully

services:
  storage-init:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -ec
      - |
        for directory in /host-data/postgres /host-data/redis /host-data/intelligence-models /host-data/media /host-data/semantic-models /host-data/exports /host-data/erasure-ledger /host-data/backups; do
          mkdir -p "$$directory"
          chown -R 999:999 "$$directory"
        done
    command: []
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/postgres
        target: /host-data/postgres
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/redis
        target: /host-data/redis
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/intelligence-models
        target: /host-data/intelligence-models
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/media
        target: /host-data/media
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/semantic-models
        target: /host-data/semantic-models
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/exports
        target: /host-data/exports
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/erasure-ledger
        target: /host-data/erasure-ledger
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/backups
        target: /host-data/backups
    restart: "no"

  postgres:
    image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cookfully}
      POSTGRES_USER: ${POSTGRES_USER:-cookfully}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/postgres
        target: /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cookfully} -d ${POSTGRES_DB:-cookfully}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/redis
        target: /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  intelligence:
    build:
      context: ..
      dockerfile: deploy/docker/intelligence.Dockerfile
    environment:
      COOKFULLY_INTELLIGENCE_SERVICE_KEY: ${COOKFULLY_INTELLIGENCE_SERVICE_KEY:-cookfully-intelligence-development}
      COOKFULLY_INTELLIGENCE_MODEL: ${COOKFULLY_INTELLIGENCE_MODEL:-needle2}
      COOKFULLY_INTELLIGENCE_MODEL_PATH: /models/needle2.cact
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      storage-init:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/intelligence-models
        target: /models
    networks:
      - intelligence-net
    expose:
      - "8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; req=urllib.request.Request('http://localhost:8091/health', headers={'x-cookfully-intelligence-key': os.environ['COOKFULLY_INTELLIGENCE_SERVICE_KEY']}); urllib.request.urlopen(req, timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment: &backend-environment
      COOKFULLY_ENVIRONMENT: ${COOKFULLY_ENVIRONMENT:-development}
      COOKFULLY_INSTANCE_ID: ${COOKFULLY_INSTANCE_ID:-00000000-0000-7000-8000-000000000001}
      COOKFULLY_SECRET_KEY: ${COOKFULLY_SECRET_KEY:?Set COOKFULLY_SECRET_KEY in .env}
      COOKFULLY_OWNER_EMAIL: ${COOKFULLY_OWNER_EMAIL:-owner@example.com}
      COOKFULLY_OWNER_BOOTSTRAP_PASSWORD: ${COOKFULLY_OWNER_BOOTSTRAP_PASSWORD:?Set COOKFULLY_OWNER_BOOTSTRAP_PASSWORD in .env}
      COOKFULLY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-cookfully}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cookfully}
      COOKFULLY_DATABASE_POOL_SIZE: ${COOKFULLY_DATABASE_POOL_SIZE:-10}
      COOKFULLY_DATABASE_MAX_OVERFLOW: ${COOKFULLY_DATABASE_MAX_OVERFLOW:-20}
      COOKFULLY_DATABASE_POOL_TIMEOUT_SECONDS: ${COOKFULLY_DATABASE_POOL_TIMEOUT_SECONDS:-30}
      COOKFULLY_DATABASE_POOL_RECYCLE_SECONDS: ${COOKFULLY_DATABASE_POOL_RECYCLE_SECONDS:-1800}
      COOKFULLY_REDIS_URL: redis://redis:6379/0
      COOKFULLY_INTELLIGENCE_ENABLED: ${COOKFULLY_INTELLIGENCE_ENABLED:-true}
      COOKFULLY_INTELLIGENCE_URL: ${COOKFULLY_INTELLIGENCE_URL:-http://intelligence:8091}
      COOKFULLY_INTELLIGENCE_SERVICE_KEY: ${COOKFULLY_INTELLIGENCE_SERVICE_KEY:-cookfully-intelligence-development}
      COOKFULLY_INTELLIGENCE_INLINE_ENABLED: ${COOKFULLY_INTELLIGENCE_INLINE_ENABLED:-true}
      COOKFULLY_INTELLIGENCE_INLINE_THRESHOLD: ${COOKFULLY_INTELLIGENCE_INLINE_THRESHOLD:-0.80}
      COOKFULLY_INTELLIGENCE_INLINE_TIMEOUT_MS: ${COOKFULLY_INTELLIGENCE_INLINE_TIMEOUT_MS:-600}
      COOKFULLY_INTELLIGENCE_TIMEOUT_SECONDS: ${COOKFULLY_INTELLIGENCE_TIMEOUT_SECONDS:-2}
      COOKFULLY_PUBLIC_BASE_URL: ${COOKFULLY_PUBLIC_BASE_URL:-http://localhost:8080}
      COOKFULLY_API_BASE_URL: ${COOKFULLY_API_BASE_URL:-http://localhost:8080}
      COOKFULLY_TRUSTED_PROXY_CIDRS: ${COOKFULLY_TRUSTED_PROXY_CIDRS:-}
      COOKFULLY_COOKIE_SECURE: ${COOKFULLY_COOKIE_SECURE:-false}
      COOKFULLY_SESSION_TTL_DAYS: ${COOKFULLY_SESSION_TTL_DAYS:-400}
      COOKFULLY_MEDIA_ROOT: /data/media
      COOKFULLY_SEMANTIC_MATCHING_MODEL_DIR: /data/semantic-models
      COOKFULLY_EXPORT_ROOT: /data/exports
      COOKFULLY_ERASURE_LEDGER_ROOT: /data/erasure-ledger
      COOKFULLY_BACKUP_ROOT: /data/backups
      COOKFULLY_FAILED_IMPORT_DIAGNOSTICS_ENABLED: ${COOKFULLY_FAILED_IMPORT_DIAGNOSTICS_ENABLED:-false}
      COOKFULLY_RETENTION_SWEEP_INTERVAL_SECONDS: ${COOKFULLY_RETENTION_SWEEP_INTERVAL_SECONDS:-21600}
      COOKFULLY_BACKUP_RETENTION_DAYS: ${COOKFULLY_BACKUP_RETENTION_DAYS:-30}
      COOKFULLY_RUN_MIGRATIONS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligence:
        condition: service_started
    networks:
      - default
      - intelligence-net
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/media
        target: /data/media
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/semantic-models
        target: /data/semantic-models
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/exports
        target: /data/exports
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/erasure-ledger
        target: /data/erasure-ledger
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/backups
        target: /data/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  worker-interactive: &worker
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    environment:
      <<: *backend-environment
      COOKFULLY_RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default
      - intelligence-net
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/media
        target: /data/media
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/semantic-models
        target: /data/semantic-models
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/exports
        target: /data/exports
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/erasure-ledger
        target: /data/erasure-ledger
    restart: unless-stopped
    command: ["celery", "-A", "cookfully.jobs.app:celery_app", "worker", "--loglevel=INFO", "--queues=interactive", "--concurrency=${COOKFULLY_INTERACTIVE_WORKER_CONCURRENCY:-2}"]

  worker-bulk:
    <<: *worker
    command: ["celery", "-A", "cookfully.jobs.app:celery_app", "worker", "--loglevel=INFO", "--queues=bulk,maintenance", "--concurrency=${COOKFULLY_BULK_WORKER_CONCURRENCY:-2}"]

  outbox:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["python", "-m", "cookfully.jobs.outbox_process"]
    environment:
      <<: *backend-environment
      COOKFULLY_RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/erasure-ledger
        target: /data/erasure-ledger
    restart: unless-stopped

  retention:
    build:
      context: ..
      dockerfile: deploy/docker/backend.Dockerfile
    command: ["python", "-m", "cookfully.jobs.retention_process"]
    environment:
      <<: *backend-environment
      COOKFULLY_RUN_MIGRATIONS: "false"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/media
        target: /data/media
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/erasure-ledger
        target: /data/erasure-ledger
    healthcheck:
      test: ["CMD", "python", "-c", "import os,pathlib,time; p=pathlib.Path('/tmp/cookfully-retention-heartbeat'); limit=2*int(os.environ['COOKFULLY_RETENTION_SWEEP_INTERVAL_SECONDS']); raise SystemExit(0 if p.exists() and time.time()-int(p.read_text()) < limit else 1)"]
      interval: 5m
      timeout: 5s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  backup:
    build:
      context: ..
      dockerfile: deploy/docker/backup.Dockerfile
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-cookfully}
      PGUSER: ${POSTGRES_USER:-cookfully}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COOKFULLY_BACKUP_ROOT: /data/backups
      COOKFULLY_DATABASE_BACKUP_SCHEDULE: ${COOKFULLY_DATABASE_BACKUP_SCHEDULE:-02:00}
      COOKFULLY_DATABASE_BACKUP_RETENTION_COUNT: ${COOKFULLY_DATABASE_BACKUP_RETENTION_COUNT:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${COOKFULLY_DATA_ROOT:-../data}/backups
        target: /data/backups
    healthcheck:
      test: ["CMD", "cookfully-database-backup", "healthcheck"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 1m
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  intelligence-net:
    internal: true
