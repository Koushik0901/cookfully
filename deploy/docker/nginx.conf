map $http_x_forwarded_proto $cookfully_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $cookfully_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
    }

    # Vite fingerprints files in /assets, so a long immutable cache is safe.
    # Keep HTML revalidated so a deployment can always point browsers at the
    # new manifest.  Compression is deliberately applied only to textual
    # payloads: AVIF/WebP media is already compressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        application/xml
        image/svg+xml
        text/css
        text/plain;

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location ~* \.(?:avif|webp|png|jpg|jpeg|ico|woff2)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri /index.html;
    }
}
