name: cookfully-restore-check

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cookfully_restore
      POSTGRES_USER: cookfully
      POSTGRES_PASSWORD: restore-check-only
    ports:
      - "55432:5432"
    volumes:
      - restore-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookfully -d cookfully_restore"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  restore-postgres-data:
