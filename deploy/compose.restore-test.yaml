name: cookfully-restore-check

services:
  postgres:
    image: ghcr.io/tensorchord/vchord-postgres:pg18-v1.1.1
    environment:
      POSTGRES_DB: cookfully_restore
      POSTGRES_USER: cookfully
      POSTGRES_PASSWORD: restore-check-only
    ports:
      - "55432:5432"
    volumes:
      - ${COOKFULLY_RESTORE_TEST_ROOT:-../data/restore-check}/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cookfully -d cookfully_restore"]
      interval: 5s
      timeout: 5s
      retries: 12
