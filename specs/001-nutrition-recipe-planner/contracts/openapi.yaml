openapi: 3.1.0
info:
  title: Cookfully API
  version: 0.2.0
  description: >-
    Canonical HTTP contract for recipes, honest nutrition estimates, goals, meal plans,
    grocery lists, exports, agent access, and later goal-aware suggestions. Public decimal
    values are canonical strings. Estimated nutrition and suggestion projections are planning
    aids, not medical advice. MCP tools compose the same application commands and queries.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
  - bearerToken: []
tags:
  - name: Recipes
  - name: Nutrition
  - name: Jobs
  - name: Goals
  - name: Meal Plans
  - name: Grocery
  - name: Data Ownership
  - name: Agent Access
  - name: Suggestions
  - name: Pantry
  - name: Reference Data

paths:
  /health:
    get:
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Process is healthy and required dependencies are reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /auth/session:
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "204":
          description: Session and CSRF cookies set.
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      operationId: deleteSession
      responses:
        "204":
          description: Current session revoked.

  /owner/preferences:
    get:
      tags: [Goals]
      operationId: getOwnerPreferences
      responses:
        "200":
          description: Owner calendar preferences used for local plan dates.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerPreferences"
    put:
      tags: [Goals]
      operationId: putOwnerPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerPreferences"
      responses:
        "200":
          description: Updated owner calendar preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerPreferences"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /owner/onboarding:
    get:
      tags: [Owner]
      operationId: getOwnerOnboarding
      responses:
        "200":
          description: The owner's first-run journey state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOnboarding"
    put:
      tags: [Owner]
      operationId: putOwnerOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OwnerOnboarding"
      responses:
        "200":
          description: The resolved first-run journey state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerOnboarding"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recipes:
    get:
      tags: [Recipes]
      operationId: listRecipes
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: query
          in: query
          schema: { type: string, maxLength: 200 }
        - name: nutritionState
          in: query
          schema: { $ref: "#/components/schemas/NutritionState" }
        - name: includeArchived
          in: query
          schema: { type: boolean, default: false }
        - name: favorite
          in: query
          schema: { type: boolean }
        - name: collectionId
          in: query
          schema: { type: string, format: uuid }
        - name: mealRole
          in: query
          schema: { type: string, enum: [breakfast, lunch, dinner, snack] }
      responses:
        "200":
          description: Cursor-paginated recipes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipePage"
    post:
      tags: [Recipes]
      operationId: createRecipe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeWrite"
      responses:
        "201":
          description: Recipe created; nutrition processing may be pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Recipe"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recipes/import:
    post:
      tags: [Recipes, Jobs]
      operationId: importRecipe
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 2048 }
      responses:
        "202":
          description: Import accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    get:
      tags: [Recipes, Nutrition]
      operationId: getRecipe
      responses:
        "200":
          description: Recipe with active resolved nutrition and provenance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Recipes]
      operationId: updateRecipe
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecipeWrite"
      responses:
        "200":
          description: Updated recipe; stale nutrition is identified in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Recipes]
      operationId: archiveRecipe
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "204":
          description: Recipe archived; historical snapshots remain.
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/collections:
    get:
      tags: [Recipes]
      operationId: listRecipeCollections
      responses:
        "200":
          description: Personal recipe collections in display order.
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/RecipeCollection" } } } }
    post:
      tags: [Recipes]
      operationId: createRecipeCollection
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeCollectionWrite" } } }
      responses:
        "201":
          description: Collection created.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecipeCollection" } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /recipes/{recipeId}/organization:
    put:
      tags: [Recipes]
      operationId: replaceRecipeOrganization
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeOrganizationWrite" } } }
      responses:
        "200":
          description: Recipe after its optional organization is replaced.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecipeDetail" } } }
        "409": { $ref: "#/components/responses/Conflict" }

  /recipes/collections/{collectionId}:
    patch:
      tags: [Recipes]
      operationId: updateRecipeCollection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RecipeCollectionWrite" } } }
      responses:
        "200":
          description: Collection renamed or reordered.
          content: { application/json: { schema: { $ref: "#/components/schemas/RecipeCollection" } } }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Recipes]
      operationId: deleteRecipeCollection
      parameters:
        - name: collectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "204": { description: Collection deleted; recipe memberships only are removed. }
        "409": { $ref: "#/components/responses/Conflict" }

  /recipes/{recipeId}/photo:
    parameters:
      - $ref: "#/components/parameters/RecipeId"
    put:
      tags: [Recipes]
      operationId: replaceRecipePhoto
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/RecipePhotoUpload"
      responses:
        "200":
          description: Recipe with the normalized replacement photo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Recipes]
      operationId: removeRecipePhoto
      parameters:
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Recipe after its optional photo is removed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/source-images:
    get:
      tags: [Recipes]
      operationId: listRecipeSourceImages
      parameters:
        - $ref: "#/components/parameters/RecipeId"
      responses:
        "200":
          description: Usable image choices discovered on the original recipe page.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RecipeSourceImage" }

  /recipes/{recipeId}/photo/source:
    put:
      tags: [Recipes]
      operationId: replaceRecipePhotoFromSource
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecipeSourceImage" }
      responses:
        "200":
          description: Recipe with the selected source photo normalized and stored.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDetail" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /recipes/{recipeId}/restore:
    post:
      tags: [Recipes, Nutrition]
      operationId: restoreRecipe
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Recipe restored to its prior usable state or with stale nutrition and a recovery action.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecipeDetail"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/permanent:
    delete:
      tags: [Recipes, Data Ownership]
      operationId: permanentlyDeleteRecipe
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [confirmation]
              properties:
                confirmation: { type: string, const: permanently-delete }
      responses:
        "204":
          description: Archived recipe permanently deleted; historical snapshots and grocery provenance remain detached.
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/nutrition/recalculate:
    post:
      tags: [Nutrition, Jobs]
      operationId: recalculateRecipeNutrition
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                resetCorrections:
                  type: boolean
                  default: false
                  description: Must be explicitly true to reset active corrections.
      responses:
        "202":
          description: Recalculation accepted; unchanged active corrections remain authoritative.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/nutrition/corrections:
    post:
      tags: [Nutrition]
      operationId: createNutritionCorrection
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NutritionCorrectionWrite"
      responses:
        "201":
          description: Correction activated and resolved nutrition updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedNutrition"
        "422":
          $ref: "#/components/responses/ValidationError"

  /recipes/{recipeId}/nutrition/corrections/{correctionId}:
    delete:
      tags: [Nutrition]
      operationId: resetNutritionCorrection
      parameters:
        - $ref: "#/components/parameters/RecipeId"
        - name: correctionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Correction reset; automatic resolved value is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedNutrition"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/current:
    get:
      tags: [Jobs]
      operationId: getCurrentJob
      parameters:
        - name: aggregateType
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 80 }
        - name: aggregateId
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Latest authoritative processing state for the aggregate, including terminal state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"

  /jobs/{jobId}:
    get:
      tags: [Jobs]
      operationId: getJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Authoritative processing state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"

  /media/{assetId}:
    get:
      tags: [Recipes]
      operationId: getRecipeMedia
      parameters:
        - name: assetId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Owner-authorized transformed recipe image with immutable private caching.
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"

  /goals/current:
    get:
      tags: [Goals]
      operationId: getCurrentGoal
      parameters:
        - name: onDate
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Goal effective on the requested local date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGoal"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Goals]
      operationId: putCurrentGoal
      parameters:
        - $ref: "#/components/parameters/IfMatchVersionOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserGoalWrite"
      responses:
        "200":
          description: Goal created or replaced for its effective period.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserGoal"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /meal-plans/{weekStart}:
    get:
      tags: [Meal Plans]
      operationId: getMealPlan
      parameters:
        - $ref: "#/components/parameters/WeekStart"
      responses:
        "200":
          description: Seven-day plan, resolved snapshots, totals, and target differences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /meal-plans/{weekStart}/entries:
    post:
      tags: [Meal Plans]
      operationId: addMealPlanEntry
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanEntryWrite"
      responses:
        "201":
          description: Entry created with an immutable resolved nutrition snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /meal-plan-entries/{entryId}:
    patch:
      tags: [Meal Plans]
      operationId: updateMealPlanEntry
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MealPlanEntryWrite"
      responses:
        "200":
          description: Entry updated; changed servings create a replacement snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MealPlanEntry"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Meal Plans]
      operationId: deleteMealPlanEntry
      parameters:
        - $ref: "#/components/parameters/EntryId"
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Entry removed and grocery list marked dirty.
        "409":
          $ref: "#/components/responses/Conflict"

  /meal-plans/{weekStart}/grocery-list:
    get:
      tags: [Grocery]
      operationId: getGroceryList
      parameters:
        - $ref: "#/components/parameters/WeekStart"
      responses:
        "200":
          description: Current or dirty grocery list with traceable sources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryList"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Grocery]
      operationId: regenerateGroceryList
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: List regenerated and manual/check state reconciled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryList"
        "409":
          $ref: "#/components/responses/Conflict"

  /meal-plans/{weekStart}/grocery-list/complete:
    post:
      tags: [Grocery]
      operationId: completeGroceryList
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Completed shopping pass retained with its source evidence.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroceryList" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /meal-plans/{weekStart}/grocery-list/reopen:
    post:
      tags: [Grocery]
      operationId: reopenGroceryList
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "200":
          description: Completed shopping pass made active explicitly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroceryList" }
        "409": { $ref: "#/components/responses/Conflict" }

  /grocery-shopping-stops:
    get:
      tags: [Grocery]
      operationId: listGroceryShoppingStops
      responses:
        "200":
          description: The owner's shopping destinations in their chosen order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroceryShoppingStop" }
    post:
      tags: [Grocery]
      operationId: createGroceryShoppingStop
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroceryShoppingStopWrite" }
      responses:
        "201":
          description: Shopping destination created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroceryShoppingStop" }
        "409": { $ref: "#/components/responses/Conflict" }

  /grocery-shopping-stops/{stopId}:
    patch:
      tags: [Grocery]
      operationId: updateGroceryShoppingStop
      parameters:
        - name: stopId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GroceryShoppingStopWrite" }
      responses:
        "200":
          description: Shopping destination renamed or reordered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroceryShoppingStop" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Grocery]
      operationId: deleteGroceryShoppingStop
      parameters:
        - name: stopId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
      responses:
        "204": { description: Stop deleted and assignments safely cleared. }
        "409": { $ref: "#/components/responses/Conflict" }

  /grocery-items/{itemId}:
    patch:
      tags: [Grocery]
      operationId: updateGroceryItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroceryItemWrite"
      responses:
        "200":
          description: Grocery item updated without changing recipe ingredients.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItem"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Grocery]
      operationId: deleteGroceryItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Manual or generated grocery item removed without changing recipe definitions.
        "409":
          $ref: "#/components/responses/Conflict"

  /meal-plans/{weekStart}/grocery-list/items:
    post:
      tags: [Grocery]
      operationId: createGroceryItem
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroceryItemCreate"
      responses:
        "201":
          description: Manual grocery item created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroceryItem"
        "409":
          $ref: "#/components/responses/Conflict"

  /pantry-items:
    get:
      x-release: expansion-p6
      tags: [Pantry]
      operationId: listPantryItems
      responses:
        "200":
          description: Pantry inventory with exact quantities and reviewable matches.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PantryItem" }
    post:
      x-release: expansion-p6
      tags: [Pantry]
      operationId: createPantryItem
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PantryItemWrite" }
      responses:
        "201":
          description: Pantry item created; ambiguous matches remain reviewable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PantryItem" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /pantry-items/{itemId}:
    patch:
      x-release: expansion-p6
      tags: [Pantry]
      operationId: updatePantryItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PantryItemWrite" }
      responses:
        "200":
          description: Quantity or manual food-reference match updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PantryItem" }
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      x-release: expansion-p6
      tags: [Pantry]
      operationId: deletePantryItem
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Pantry item removed when no applied deduction depends on it.
        "409":
          $ref: "#/components/responses/Conflict"

  /pantry/recipe-matches:
    get:
      x-release: expansion-p6
      tags: [Pantry]
      operationId: findMakeableRecipes
      parameters:
        - name: query
          in: query
          schema: { type: [string, "null"], maxLength: 200 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Fully makeable recipes first, then partial matches with missing ingredients.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PantryRecipeMatch" }

  /meal-plans/{weekStart}/grocery-list/pantry-deductions:
    post:
      x-release: expansion-p6
      tags: [Pantry, Grocery]
      operationId: applyPantryDeductions
      parameters:
        - $ref: "#/components/parameters/WeekStart"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PantryDeductionApply" }
      responses:
        "200":
          description: Only exact safe matches deducted; every result remains visible and reversible.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PantryDeduction" }
        "409":
          $ref: "#/components/responses/Conflict"

  /pantry-deductions/{deductionId}:
    delete:
      x-release: expansion-p6
      tags: [Pantry, Grocery]
      operationId: reversePantryDeduction
      parameters:
        - name: deductionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IfMatchVersion"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Deducted pantry and grocery quantities restored exactly.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PantryDeduction" }
        "409":
          $ref: "#/components/responses/Conflict"

  /exports:
    post:
      tags: [Data Ownership, Jobs]
      operationId: createPortableExport
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                includeMedia: { type: boolean, default: true }
      responses:
        "202":
          description: Export accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /exports/{jobId}/download:
    get:
      tags: [Data Ownership, Jobs]
      operationId: downloadPortableExport
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One-time portable export archive download.
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: The one-time download has already been consumed.

  /access-tokens:
    get:
      tags: [Agent Access]
      operationId: listAccessTokens
      responses:
        "200":
          description: Token metadata; raw token secrets are never returned.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AccessToken" }
    post:
      tags: [Agent Access]
      operationId: createAccessToken
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessTokenWrite" }
      responses:
        "201":
          description: Token created; secret is returned exactly once.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessTokenCreated" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /access-tokens/{tokenId}:
    delete:
      tags: [Agent Access]
      operationId: revokeAccessToken
      parameters:
        - name: tokenId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "204":
          description: Token revoked immediately.
        "404":
          $ref: "#/components/responses/NotFound"

  /suggestions:
    post:
      x-release: expansion-p4
      tags: [Suggestions]
      operationId: createSuggestion
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionRequest"
      responses:
        "202":
          description: Deterministic optimization accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"

  /suggestions/{suggestionId}:
    get:
      x-release: expansion-p4
      tags: [Suggestions]
      operationId: getSuggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Suggestion progress or terminal feasible/infeasible result with projected totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestionResult" }
        "404":
          $ref: "#/components/responses/NotFound"

  /suggestions/{suggestionId}/accept:
    post:
      x-release: expansion-p4
      tags: [Suggestions, Meal Plans]
      operationId: acceptSuggestion
      parameters:
        - name: suggestionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionAcceptance" }
      responses:
        "200":
          description: Selected suggestion items accepted through normal plan mutations; totals equal the preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MealPlan" }
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/sessions:
    get:
      operationId: list_sessions
      responses:
        "200":
          description: Active sessions with the current session flagged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionListResponse" }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/sessions/{session_id}:
    delete:
      operationId: revoke_session
      parameters:
        - name: session_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Session revoked; the current session is also signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/password:
    post:
      operationId: change_password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChangeRequest" }
      responses:
        "204":
          description: Password changed; all other sessions revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

  /foods/search:
    get:
      operationId: search_foods
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: Matching reference and owner food candidates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodSearchResponse" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /foods/user:
    get:
      operationId: list_user_foods
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Owner-created foods, optionally filtered by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OwnerFoodResponse" }
    post:
      operationId: create_user_food
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerFoodWriteRequest" }
      responses:
        "201":
          description: Created owner food.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerFoodResponse" }
        "422":
          $ref: "#/components/responses/ValidationError"

  /foods/user/{foodId}:
    put:
      operationId: update_user_food
      parameters:
        - name: foodId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OwnerFoodUpdateRequest" }
      responses:
        "200":
          description: Updated owner food.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OwnerFoodResponse" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: delete_user_food
      parameters:
        - name: foodId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expectedVersion
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204":
          description: Owner food deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /recipes/{recipeId}/ingredients/{ingredientId}/candidates:
    get:
      operationId: list_ingredient_candidates
      parameters:
        - name: recipeId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: ingredientId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matching reference and owner food candidates for the ingredient.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FoodSearchResponse" }
        "404":
          $ref: "#/components/responses/NotFound"

  /reference-data/status:
    get:
      tags: [Reference Data]
      operationId: get_reference_data_status
      responses:
        "200":
          description: Reference data availability and latest install job.

  /reference-data/install:
    post:
      tags: [Reference Data]
      operationId: install_reference_data
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: Install job accepted.
        "409":
          description: An install is already in flight.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cookfully_session
    bearerToken:
      type: http
      scheme: bearer

  parameters:
    RecipeId:
      name: recipeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EntryId:
      name: entryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WeekStart:
      name: weekStart
      in: path
      required: true
      schema: { type: string, format: date }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
    IfMatchVersionOptional:
      name: If-Match
      in: header
      required: false
      schema: { type: string, pattern: '^"[1-9][0-9]*"$' }

  responses:
    BadRequest:
      description: Request cannot be safely processed.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: Authentication failed or is missing.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: Resource not found or not visible.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: Stale version, duplicate idempotency key with different input, or invalid transition.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationError:
      description: One or more fields are invalid.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Health:
      type: object
      required: [status, database, broker]
      properties:
        status: { type: string, enum: [ok, degraded] }
        database: { type: string, enum: [ok, unavailable] }
        broker: { type: string, enum: [ok, unavailable] }
        version: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12, maxLength: 1024 }
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 1024 }
        newPassword: { type: string, minLength: 12, maxLength: 1024 }
    SessionItem:
      type: object
      required: [id, clientLabel, createdAt, lastSeenAt, isCurrent]
      properties:
        id: { type: string, format: uuid }
        clientLabel: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        isCurrent: { type: boolean }
    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: "#/components/schemas/SessionItem" }
    FoodSearchResponse:
      type: object
      required: [query, candidates]
      properties:
        query: { type: string }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/FoodCandidateResponse" }
    FoodCandidateResponse:
      type: object
      required: [source, id, description, brandOwner, servingSizeG, servingUnit]
      properties:
        source: { type: string }
        id: { type: string, format: uuid }
        description: { type: string }
        brandOwner: { type: string }
        servingSizeG: { type: string }
        servingUnit: { type: string }
    OwnerFoodResponse:
      type: object
      required:
        [id, displayName, normalizedName, caloriesKcal, proteinG, carbohydrateG, fatG, basisGrams, typicalServingG, typicalServingUnit, version]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        normalizedName: { type: string }
        brand: { type: string }
        caloriesKcal: { $ref: "#/components/schemas/Decimal6" }
        proteinG: { $ref: "#/components/schemas/Decimal6" }
        carbohydrateG: { $ref: "#/components/schemas/Decimal6" }
        fatG: { $ref: "#/components/schemas/Decimal6" }
        basisGrams: { $ref: "#/components/schemas/Decimal6" }
        typicalServingG: { $ref: "#/components/schemas/Decimal6" }
        typicalServingUnit: { type: string }
        version: { type: integer, minimum: 1 }
    OwnerFoodWriteRequest:
      type: object
      additionalProperties: false
      required: [displayName, caloriesKcal, proteinG, carbohydrateG, fatG]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 500 }
        brand: { type: string }
        caloriesKcal: { $ref: "#/components/schemas/Decimal6" }
        proteinG: { $ref: "#/components/schemas/Decimal6" }
        carbohydrateG: { $ref: "#/components/schemas/Decimal6" }
        fatG: { $ref: "#/components/schemas/Decimal6" }
        basisGrams: { $ref: "#/components/schemas/Decimal6" }
        typicalServingG: { $ref: "#/components/schemas/Decimal6" }
        typicalServingUnit: { type: string }
    OwnerFoodUpdateRequest:
      type: object
      additionalProperties: false
      required: [displayName, caloriesKcal, proteinG, carbohydrateG, fatG, expectedVersion]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 500 }
        brand: { type: string }
        caloriesKcal: { $ref: "#/components/schemas/Decimal6" }
        proteinG: { $ref: "#/components/schemas/Decimal6" }
        carbohydrateG: { $ref: "#/components/schemas/Decimal6" }
        fatG: { $ref: "#/components/schemas/Decimal6" }
        basisGrams: { $ref: "#/components/schemas/Decimal6" }
        typicalServingG: { $ref: "#/components/schemas/Decimal6" }
        typicalServingUnit: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    OwnerPreferences:
      type: object
      additionalProperties: false
      required: [displayName, timezone, weekStartsOn, version]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 80 }
        timezone: { type: string, minLength: 1, maxLength: 100 }
        weekStartsOn: { type: integer, minimum: 1, maximum: 7 }
        version: { type: integer, minimum: 1 }
    OwnerOnboarding:
      type: object
      additionalProperties: false
      required: [state, version]
      properties:
        state: { type: string, enum: [pending, completed, dismissed] }
        firstAction:
          type: [string, "null"]
          enum: [manual_recipe, import_recipe, view_plan, null]
        resolvedAt: { type: [string, "null"], format: date-time }
        version: { type: integer, minimum: 1 }
    RecipePhotoUpload:
      type: object
      additionalProperties: false
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: JPEG, PNG, or WebP image no larger than 20 MB before normalization.
    RecipeSourceImage:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 2048 }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    Decimal6:
      type: string
      description: Canonical non-negative fixed decimal with at most six fractional places and no exponent.
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
    SignedDecimal6:
      type: string
      description: Canonical signed fixed decimal with at most six fractional places and no exponent.
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
    ServingDecimal:
      type: string
      description: Positive serving quantity with at most three fractional places.
      pattern: '^(?!0(?:\.0{1,3})?$)(?:0|[1-9][0-9]*)(?:\.[0-9]{1,3})?$'
    RatioDecimal:
      type: string
      description: Canonical fixed decimal from zero through one.
      pattern: '^(0(\.[0-9]{1,6})?|1(\.0{1,6})?)$'
    DisplayCalories:
      type: string
      description: Round-half-up whole-kilocalorie display value.
      pattern: '^(0|[1-9][0-9]*)$'
    SignedDisplayCalories:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
    DisplayMacro:
      type: string
      description: Round-half-up macro display value with exactly one fractional place.
      pattern: '^(0|[1-9][0-9]*)\.[0-9]$'
    SignedDisplayMacro:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)\.[0-9]$'
    NutritionState:
      type: string
      enum: [pending, source_provided, estimated, partial, failed, stale]
    NutritionStatus:
      type: string
      enum: [source_provided, estimated, partial, manual]
    MacroValues:
      type: object
      required: [caloriesKcal, proteinG, carbohydrateG, fatG]
      properties:
        caloriesKcal: { oneOf: [{ $ref: "#/components/schemas/Decimal6" }, { type: "null" }] }
        proteinG: { oneOf: [{ $ref: "#/components/schemas/Decimal6" }, { type: "null" }] }
        carbohydrateG: { oneOf: [{ $ref: "#/components/schemas/Decimal6" }, { type: "null" }] }
        fatG: { oneOf: [{ $ref: "#/components/schemas/Decimal6" }, { type: "null" }] }
    GoalMacroValues:
      type: object
      required: [caloriesKcal, proteinG, carbohydrateG, fatG]
      properties:
        caloriesKcal: { $ref: "#/components/schemas/Decimal6" }
        proteinG: { $ref: "#/components/schemas/Decimal6" }
        carbohydrateG: { $ref: "#/components/schemas/Decimal6" }
        fatG: { $ref: "#/components/schemas/Decimal6" }
    DisplayMacroValues:
      type: object
      required: [caloriesKcal, proteinG, carbohydrateG, fatG]
      properties:
        caloriesKcal: { oneOf: [{ $ref: "#/components/schemas/DisplayCalories" }, { type: "null" }] }
        proteinG: { oneOf: [{ $ref: "#/components/schemas/DisplayMacro" }, { type: "null" }] }
        carbohydrateG: { oneOf: [{ $ref: "#/components/schemas/DisplayMacro" }, { type: "null" }] }
        fatG: { oneOf: [{ $ref: "#/components/schemas/DisplayMacro" }, { type: "null" }] }
    SignedDisplayMacroValues:
      type: object
      required: [caloriesKcal, proteinG, carbohydrateG, fatG]
      properties:
        caloriesKcal: { oneOf: [{ $ref: "#/components/schemas/SignedDisplayCalories" }, { type: "null" }] }
        proteinG: { oneOf: [{ $ref: "#/components/schemas/SignedDisplayMacro" }, { type: "null" }] }
        carbohydrateG: { oneOf: [{ $ref: "#/components/schemas/SignedDisplayMacro" }, { type: "null" }] }
        fatG: { oneOf: [{ $ref: "#/components/schemas/SignedDisplayMacro" }, { type: "null" }] }
    MicronutrientValue:
      type: object
      additionalProperties: false
      required: [value, unit, explicitZero, coverageRatio, source, mappingVersion, usdaNutrientId]
      properties:
        value: { oneOf: [{ $ref: "#/components/schemas/Decimal6" }, { type: "null" }] }
        unit: { type: string, enum: [g, mg, ug] }
        explicitZero: { type: boolean }
        coverageRatio: { $ref: "#/components/schemas/RatioDecimal" }
        source: { type: string, enum: [reference, source, manual, unavailable] }
        mappingVersion: { type: string, minLength: 1 }
        usdaNutrientId: { type: integer, minimum: 1 }
    Micronutrients:
      type: object
      additionalProperties: false
      required: [dietaryFiberG, sodiumMg, potassiumMg, calciumMg, ironMg, magnesiumMg, vitaminCMg, vitaminDUg, vitaminB12Ug]
      properties:
        dietaryFiberG: { $ref: "#/components/schemas/MicronutrientValue" }
