<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/chicken-stroganoff"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken stroganoff","recipeYield":"4 servings","recipeIngredient":["2 tbsp olive oil","4 skinless chicken breasts cut into chunks","2 onions finely chopped","4 garlic cloves crushed","1 tbsp sweet paprika","400ml chicken stock","4 tsp Dijon mustard","2 tbsp Worcestershire sauce","200g soured cream or crème fraiche","a large handful of parsley chopped","rice mash or pasta, to serve"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat half the oil in a frying pan and fry the chicken pieces over a medium high heat, stirring frequently. until golden brown. Season and transfer to a plate."},{"@type":"HowToStep","text":"Heat the remaining oil and lower the heat to medium. Fry the onion for 6-8 mins until softened but not golden, then stir in the garlic and paprika. Fry for a minute until fragrant, then pour in the stock, and add the Dijon and Worcestershire sauce. Tip in the seared chicken with any resting juices, and simmer for 5-6 mins until reduced slightly and the chicken is cooked through."},{"@type":"HowToStep","text":"Over a low heat, stir in the soured cream until just combined to create a creamy sauce, and it’s just started to simmer. Scatter over the parsley and serve with rice, mash or pasta, if you like."}],"nutrition":{"@type":"NutritionInformation","calories":"425 calories","fatContent":"23 grams fat","saturatedFatContent":"7 grams saturated fat","carbohydrateContent":"11 grams carbohydrates","sugarContent":"9 grams sugar","fiberContent":"3 grams fiber","proteinContent":"43 grams protein","sodiumContent":"1.69 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/chicken-stroganoff"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
