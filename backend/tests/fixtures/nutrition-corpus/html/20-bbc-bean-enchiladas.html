<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/bean-enchiladas"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Vegetarian enchiladas","recipeYield":"4 servings","recipeIngredient":["1 tsp olive oil","2 onions chopped","280g carrots grated","2-3 tsp chilli powder (mild or hot, according to your taste)","2 x 400g cans chopped tomatoes","2 x 400g cans pulses in water, drained (we used mixed beans and lentils)","6 small wholemeal tortillas","200g low-fat natural yogurt","50g extra-mature cheddar cheese (or veg alternative), finely grated"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat the oil in a large frying pan. Cook the onions and carrots for 5-8 mins until soft – add a splash of water if they start to stick. Sprinkle in the chilli powder and cook for 1 min more. Pour in the tomatoes and pulses and bring to the boil. Turn down the heat and simmer for 5-10 mins, stirring occasionally, until thickened. Remove from the heat and season well."},{"@type":"HowToStep","text":"Heat grill to high. Spread a spoonful of the bean chilli over a large ovenproof dish. Lay each tortilla onto a board, fill with a few tbsp of chilli mixture, fold over the ends and roll up to seal. Place them into the ovenproof dish. Spoon the remaining chilli on top."},{"@type":"HowToStep","text":"Mix the yogurt and grated cheese together with some seasoning, and spoon over the enchiladas. Grill for a few mins until the top is golden and bubbling. Serve with a green salad."}],"nutrition":{"@type":"NutritionInformation","calories":"430 calories","fatContent":"13 grams fat","saturatedFatContent":"4 grams saturated fat","carbohydrateContent":"60 grams carbohydrates","sugarContent":"17 grams sugar","fiberContent":"15 grams fiber","proteinContent":"23 grams protein","sodiumContent":"1.36 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/bean-enchiladas"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
