<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/oven-baked-chicken-and-rice/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Oven Baked Chicken and Rice","recipeYield":"5 servings","recipeIngredient":["5 bone in chicken thigh fillets, peel skin OFF (, (Note 1))","1 onion (, chopped (brown, white or yellow))","2 cloves garlic (large) (, minced)","2 tbsp (30g) butter (or olive oil)","1 1/2 cups (270g) uncooked white rice (Note 3)","1 1/2 cups (375 ml) chicken broth/stock (, hot (I microwave))","1 1/4 cups (315 ml) water (, hot (tap is fine))","1 tsp paprika powder","1 tsp dried thyme","1/2 tsp garlic powder","1/2 tsp onion powder","3/4 tsp salt","Black pepper","Oil spray","Fresh thyme leaves or finely chopped parsley"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 180°C/350°F."},{"@type":"HowToStep","text":"Scatter onion and garlic in a baking dish (about 10 x 15\" / 25 x 35 cm), then place butter in the centre. Bake for 15 minutes (check at 12 minutes, mix if some bits are browning too much)."},{"@type":"HowToStep","text":"Meanwhile, mix together Chicken Rub. Sprinkle on both sides of the chicken."},{"@type":"HowToStep","text":"Remove baking dish from the oven. Add rice then mix."},{"@type":"HowToStep","text":"Place chicken on rice. Then pour chicken broth and water around the chicken."},{"@type":"HowToStep","text":"Cover with foil, then bake for 30 minutes. Remove foil, spray chicken with oil (optional, gives chicken nicer finish), then bake for a further 20 minutes until liquid is absorbed."},{"@type":"HowToStep","text":"Stand for 5 minutes, then remove chicken and fluff up rice. Garnish with parsley or thyme if desired, serve and enjoy!"},{"@type":"HowToStep","text":"Optional gravy"},{"@type":"HowToStep","text":"Dish is flavoured enough to serve without sauce, but if you want to take it over the top, make this quick Gravy in 4 minutes flat (pictured in video)."}],"nutrition":{"@type":"NutritionInformation","servingSize":"318 g","calories":"574 kcal","carbohydrateContent":"47 g","proteinContent":"28 g","fatContent":"29 g","saturatedFatContent":"9 g","cholesterolContent":"153 mg","sodiumContent":"766 mg","fiberContent":"1 g","sugarContent":"1 g"},"url":"https://www.recipetineats.com/oven-baked-chicken-and-rice/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
