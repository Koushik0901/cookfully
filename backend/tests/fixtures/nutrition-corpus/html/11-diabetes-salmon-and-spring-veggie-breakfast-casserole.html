<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://diabetesfoodhub.org/recipes/salmon-and-spring-veggie-breakfast-casserole"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Salmon and Spring Veggie Breakfast Casserole","recipeYield":"6 servings","recipeIngredient":["nonstick cooking spray 1.00 1 spray","0.25 g","asparagus 1.00 lbs about 16 spears","trimmed and cut into 2-inch pieces","fresh or frozen peas 1.50 cup","broccoli 2.00 cup florets","chopped","red bell pepper 0.50 med diced","canned salmon 2.00 can drained","egg whites 6.00 large or 3/4 cup egg substitute","eggs 3.00 large","cottage cheese 0.75 cup reduced fat","reduced sodium","fresh dill 3.00 tbsp chopped","black pepper 0.50 tsp","lemon juice 2.00 tbsp","part-skim mozzarella 0.50 cup shredded","whole grain bread 6.00 slice toasted"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat the oven to 350 degrees F. Spray a 9x13-inch casserole dish with cooking spray."},{"@type":"HowToStep","text":"Place the asparagus"},{"@type":"HowToStep","text":"peas"},{"@type":"HowToStep","text":"and broccoli in a medium saucepan with about 1 inch of water. Cover and bring to a boil and cook for about 2 minutes"},{"@type":"HowToStep","text":"or until the vegetables are bright green and just slightly tender. Drain and place the vegetables in a bowl of ice water to cool quickly. Once cold"},{"@type":"HowToStep","text":"drain well"},{"@type":"HowToStep","text":"mix in the red bell pepper"},{"@type":"HowToStep","text":"and spread the vegetables out in the prepared casserole. Distribute the salmon pieces over the vegetables."},{"@type":"HowToStep","text":"In a medium bowl"},{"@type":"HowToStep","text":"beat the egg whites and eggs on medium speed for about 1 minute. The mixture should be slightly bubbly. Add the cottage cheese"},{"@type":"HowToStep","text":"dill"},{"@type":"HowToStep","text":"black pepper"},{"@type":"HowToStep","text":"and lemon juice and beat on medium speed for another minute to break up the cheese and combine."},{"@type":"HowToStep","text":"Pour the egg mixture over the vegetables and salmon. Top with mozzarella cheese."},{"@type":"HowToStep","text":"Bake for 50-60 minutes"},{"@type":"HowToStep","text":"until the egg mixture is firm and no liquid remains. An inserted knife or toothpick should come out clean."},{"@type":"HowToStep","text":"Cut into 6 pieces"},{"@type":"HowToStep","text":"garnish with fresh microgreens if desired"},{"@type":"HowToStep","text":"and serve with a slice of toast."}],"nutrition":{"@type":"NutritionInformation","servingSize":"1 wedge of casserole + 1 slice of toast","calories":"270","carbohydrateContent":"29g","cholesterolContent":"110mg","fiberContent":"5g","proteinContent":"25g","sodiumContent":"420mg","sugarContent":"2g","fatContent":"7g","saturatedFatContent":"2.5g","transFatContent":"0g"},"url":"https://diabetesfoodhub.org/recipes/salmon-and-spring-veggie-breakfast-casserole"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
