ced garlic"},{"@type":"HowToStep","text":"and breadcrumbs in a large bowl. Mix them together with your hands or a couple of forks until all are well combined and evenly distributed. Divide the mixture and form into 16 small logs or roll into meatball shapes."},{"@type":"HowToStep","text":"Heat a large non-stick frying pan over medium heat and spray with cooking spray. Once hot"},{"@type":"HowToStep","text":"add the chicken rolls and cook on one side until browned. Continue turning to brown all sides and cooked through"},{"@type":"HowToStep","text":"about 10 minutes. They should reach an internal temperature of 165 degrees F on an instant-read thermometer."},{"@type":"HowToStep","text":"Serve 4 kofta rolls on top of one lettuce leaf with 1 1/4 cups of tabbouleh"},{"@type":"HowToStep","text":"2 Tbsp of hummus"},{"@type":"HowToStep","text":"and 1 small pita on the side."}],"nutrition":{"@type":"NutritionInformation","servingSize":"4 chicken kofta + 1 1/4 cups tabbouleh + 2 Tbsp hummus + 1 small pita","calories":"390","carbohydrateContent":"35g","cholesterolContent":"110mg","fiberContent":"7g","proteinContent":"36g","sodiumContent":"390mg","sugarContent":"1g","fatContent":"13g","saturatedFatContent":"1.5g","transFatContent":"0g"},"url":"https://diabetesfoodhub.org/recipes/chicken-kofta-tabbouleh"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
