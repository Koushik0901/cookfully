<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.skinnytaste.com/high-protein-bread-oat-sandwich-rolls/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"High Protein Bread (Oat Sandwich Rolls)","recipeYield":"4 servings","recipeIngredient":["1 cup oat flour (plus more for dusting if needed*)","2 teaspoons baking powder (make sure it's not expired or it won't rise)","3/4 teaspoon kosher salt (use less if using table salt)","1 cup low-fat classic cottage cheese (I like Good Culture drained of any whey at the top)","1 egg white (beaten (whole egg works fine too))","Everything bagel seasoning (sesame, etc for topping, optional)"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 375F. Place parchment paper or a silicone mat on a baking sheet. If using parchment paper, spray with oil to avoid sticking."},{"@type":"HowToStep","text":"In a medium bowl combine the flour, baking powder and salt and whisk well."},{"@type":"HowToStep","text":"Add the cottage cheese, mix with a fork or spatula until well combined, it will look like small crumbles."},{"@type":"HowToStep","text":"Knead in the bowl turning until completely smooth and has the texture of playdoh, about 20 turns."},{"@type":"HowToStep","text":"Divide into 4 equal balls."},{"@type":"HowToStep","text":"Flatten into rounds and transfer to the baking sheet."},{"@type":"HowToStep","text":"Top with egg wash and seasoning. Bake on the top rack of the oven for 22 to 25 minutes."},{"@type":"HowToStep","text":"Let cool at least 15 minutes before slicing open."},{"@type":"HowToStep","text":"Air Fryer Method:"},{"@type":"HowToStep","text":"Preheat the air fryer 280F degrees. Transfer in batches without overcrowding and bake 15 to 16 minutes, or until golden. No need to turn. Let cool at least 15 minutes before cutting."}],"nutrition":{"@type":"NutritionInformation","servingSize":"1 roll","calories":"135.5 kcal","carbohydrateContent":"18 g","proteinContent":"10.5 g","fatContent":"3 g","saturatedFatContent":"1 g","cholesterolContent":"5 mg","sodiumContent":"582.5 mg","fiberContent":"2.5 g","sugarContent":"1.5 g"},"url":"https://www.skinnytaste.com/high-protein-bread-oat-sandwich-rolls/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
