<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/crispy-chilli-turkey-noodles"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Crispy chilli turkey noodles","recipeYield":"4 servings","recipeIngredient":["2 tbsp sesame oil","500g turkey mince","5cm piece ginger grated","1 large garlic clove crushed","3 tbsp honey","3 tbsp soy sauce","1 tbsp hot sriracha chilli sauce","350g dried udon noodles","2 limes juiced, plus wedges to serve (optional)","2 large carrots peeled and cut into matchsticks","4 spring onions shredded","1 small bunch coriander sliced (optional)"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat 1 tbsp oil in a large non-stick frying pan over a high heat. Once hot, add the turkey mince to the pan and fry for 10-12 mins until golden brown and crispy, breaking up the meat with a wooden spoon as you go. Add the ginger and garlic to the pan and cook for 1 min. Stir in the honey, soy and chilli sauce and cook for 2 mins."},{"@type":"HowToStep","text":"Meanwhile, bring a large pan of water to the boil, add the noodles and cook following pack instructions. Drain and toss the noodles with the remaining 1 tbsp oil and all the lime juice, then divide between bowls. Top with the crispy turkey mince, carrot, onion and coriander. Serve with extra lime wedges for squeezing over, if you like."}],"nutrition":{"@type":"NutritionInformation","calories":"566 calories","fatContent":"8 grams fat","saturatedFatContent":"1 grams saturated fat","carbohydrateContent":"83 grams carbohydrates","sugarContent":"19 grams sugar","fiberContent":"2 grams fiber","proteinContent":"40 grams protein","sodiumContent":"3.9 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/crispy-chilli-turkey-noodles"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
