<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/chickpea-coriander-burgers"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chickpea & coriander burgers","recipeYield":"4 servings","recipeIngredient":["400g can chickpeas drained","zest 1 lemon plus juice ½","1 tsp ground cumin","small bunch coriander chopped","1 egg","100g fresh breadcrumbs","1 medium red onion ½ diced, ½ sliced","1 tbsp olive oil","4 small wholemeal buns","1 large tomato sliced, ½ cucumber, sliced and chilli sauce, to serve"],"recipeInstructions":[{"@type":"HowToStep","text":"In a food processor, whizz the chickpeas, lemon zest, lemon juice, cumin, half the coriander, the egg and some seasoning. Scrape into a bowl and mix with 80g of the breadcrumbs and the diced onions. Form 4 burgers, press remaining breadcrumbs onto both sides and chill for at least 10 mins."},{"@type":"HowToStep","text":"Heat the oil in a frying pan until hot. Fry the burgers for 4 mins each side, keeping the heat on medium so they don’t burn. To serve, slice each bun and fill with a slice of tomato, a burger, a few red onion slices, some cucumber slices, a dollop of chilli sauce and the remaining coriander."}],"nutrition":{"@type":"NutritionInformation","calories":"344 calories","fatContent":"8 grams fat","saturatedFatContent":"1 grams saturated fat","carbohydrateContent":"56 grams carbohydrates","sugarContent":"6 grams sugar","fiberContent":"6 grams fiber","proteinContent":"15 grams protein","sodiumContent":"1.3 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/chickpea-coriander-burgers"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
