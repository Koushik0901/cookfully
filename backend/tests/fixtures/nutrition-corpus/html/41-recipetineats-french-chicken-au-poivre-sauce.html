<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/french-chicken-au-poivre-sauce/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"JB's Chicken au Poivre (Creamy Peppercorn Sauce)","recipeYield":"4 servings","recipeIngredient":["2 large chicken breasts (, skinless & boneless (250–300g / 8–10oz each) (Note 1))","3/4 tsp cooking salt / kosher salt","2 tbsp vegetable oil (, or any other neutral flavoured oil)","2 tsp whole black peppercorns (, coarsely crushed (Note 2))","1/3 cup brandy or cognac (, or marsala (Note 3))","1 1/2 cups beef stock / broth (, low sodium (Note 4))","3/4 cup thickened / heavy cream (, or any other full fat cream)"],"recipeInstructions":[{"@type":"HowToStep","text":"ABBREVIATED RECIPE"},{"@type":"HowToStep","text":"Season chicken with salt. Sear in oil until golden. Remove. Deglaze with cognac. Add beef stock, simmer for 4 minutes . Pour cream, add pepper and simmer for 5 minutes. Return chicken, cook for 3 minutes while basting. Serve immediately."},{"@type":"HowToStep","text":"FULL RECIPE"},{"@type":"HowToStep","text":"Prepare the chicken - Cut each chicken breast in half horizontally to make 4 thin steaks and sprinkle both sides with salt (If you’re wondering why I don’t season the chicken with pepper it’s because once combined with the sauce, it would make the dish too peppery.)"},{"@type":"HowToStep","text":"COOKING AND SAUCE"},{"@type":"HowToStep","text":"Sear the chicken - Heat oil in a large pan (28cm / 11\") over high heat. Add chicken and cook 2–3 minutes per side until golden. Remove to a plate and rest (don’t cover). If you think your chicken is still a little bit under after resting, don’t worry it will finish cooking later in the sauce."},{"@type":"HowToStep","text":"Deglaze with brandy - TURN THE STOVE OFF to avoid the brandy catching fire (unless you want to flambé). Then carefully pour the brandy in. Be careful, it will sizzle hard, that’s normal. Let it bubble for 20-30 seconds to let alcohol burn off, reduce by about 2/3 (turn the stove on if needed). Scrape the fond at the base of the pan well to release all that flavour. (Note 5 & 6)"},{"@type":"HowToStep","text":"Beef stock - Turn the heat back on high. Add beef stock. Simmer rapidly for 4 minutes, until reduced by half."},{"@type":"HowToStep","text":"Cream - Stir in cream and crushed pepper. Lower the heat to medium high. Simmer for 3-4 minutes, to reduce the sauce until it thickens enough to lightly coat the back of a spoon. Stir and scrape the sides of the pan as it reduces. Keep in mind that some stoves run stronger than others. If the heat is gentler, the sauce may take a little longer to reduce, so just allow a bit of extra time."},{"@type":"HowToStep","text":"FINISH"},{"@type":"HowToStep","text":"Simmer - Turn heat down to medium. Return chicken and resting juices to the pan. Cook 2–3 minutes, spooning the sauce over the chicken, until it is warmed through and the sauce darkens in colour and thickens a little more. When you drag a spoon through the pan, the sauce should slowly flow back together. If it thickens too much, add a splash of cream or water to loosen."},{"@type":"HowToStep","text":"Serve - This dish is best served straight away. If it sits, the sauce can become too thick and the chicken be overcooked."}],"nutrition":{"@type":"NutritionInformation","calories":"442 kcal","carbohydrateContent":"3 g","proteinContent":"35 g","fatContent":"27 g","saturatedFatContent":"12 g","transFatContent":"0.04 g","cholesterolContent":"146 mg","sodiumContent":"788 mg","fiberContent":"1 g","sugarContent":"1 g","unsaturatedFatContent":"13 g","servingSize":"1 serving"},"url":"https://www.recipetineats.com/french-chicken-au-poivre-sauce/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
