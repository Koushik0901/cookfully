<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/chicken-and-sweet-corn-soup-with-noodles/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Chicken and Sweet Corn Soup with Pasta","recipeYield":"4 servings","recipeIngredient":["2 tbsp olive oil or butter","350 - 400g/ 12 - 14oz chicken breast (, cut in half horizontally to form 2 thin steaks (Note 1))","1/2 tsp cooking salt","Pinch of black pepper","1/2 onion (, finely diced)","3 garlic cloves (, finely minced or minced using garlic crusher)","400g/14oz can sweet corn (, drained (or 2 cups frozen or fresh corn))","400g/14oz can creamed corn","3 cups chicken stock/broth (, low sodium (2 empty cans! Note 2))","3 cups milk (, full or low fat, dairy or non-dairy (2 empty cans, Note 2))","1/2 tsp cooking salt / kosher salt","1/4 tsp black pepper","1 1/2 cups broken angel hair pasta (, or other small pasta like risoni/ditalini, or break long strand pasta (Note 2))","1 cup shredded cheddar cheese (, or tasty cheese, Colby, Monterey jack, or any other flavourful melting cheese)","3 tightly packed cups kale leaves ( (torn into bite size pieces) or baby spinach)","Something green - sliced green onion, chopped parsley","Shredded cheese"],"recipeInstructions":[{"@type":"HowToStep","text":"Season chicken - Sprinkle each side of the chicken with the salt and pepper."},{"@type":"HowToStep","text":"Sear chicken - Heat the oil in a large pot over high heat. Put the chicken in and sear each side for 1 1/2 minutes or until light golden, then remove (it doesn't matter if it's not cooked through)."},{"@type":"HowToStep","text":"Make soup broth - Into the same pot, add the onion and garlic. Cook for 2 to 3 minutes or until translucent. Add the creamed corn, corn, stock, milk, salt and pepper. Bring to a simmer."},{"@type":"HowToStep","text":"Chop chicken - Meanwhile, cut the chicken into 1cm / 0.4\" cubes."},{"@type":"HowToStep","text":"Add pasta - Add the pasta and chicken (and any juices on the cutting board). Cook for 3 minutes (or whatever the pasta cook time is)."},{"@type":"HowToStep","text":"Stir ins - Add cheese and stir to melt. Add the kale and stir until it wilts."},{"@type":"HowToStep","text":"Serve immediately, with a little sprinkle of green onion and extra cheese if you want!"}],"nutrition":{"@type":"NutritionInformation","calories":"488 kcal","carbohydrateContent":"49 g","proteinContent":"34 g","fatContent":"19 g","saturatedFatContent":"10 g","transFatContent":"0.3 g","cholesterolContent":"97 mg","sodiumContent":"1698 mg","fiberContent":"4 g","sugarContent":"14 g","unsaturatedFatContent":"7 g","servingSize":"1 serving"},"url":"https://www.recipetineats.com/chicken-and-sweet-corn-soup-with-noodles/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
