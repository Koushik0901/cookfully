<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/oven-baked-chicken-breast/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Oven Baked Chicken Breast","recipeYield":"4 servings","recipeIngredient":["4 chicken breasts (, 150 - 180g / 5 - 6 oz each (Note 1))","2 tsp olive oil","1 1/2 tbsp brown sugar","1 tsp paprika","1 tsp dried oregano or thyme (, or other herb of choice)","1/4 tsp garlic powder","1/2 tsp each salt and pepper","Finely chopped parsley"],"recipeInstructions":[{"@type":"HowToStep","text":"Preheat oven to 425°F/220°C (200°C fan)."},{"@type":"HowToStep","text":"Pound chicken to 1.5cm / 0.6\" at the thickest part - using a rolling pin, meat mallet or even your fist (key tip for even cooking + tender chicken)."},{"@type":"HowToStep","text":"Mix Seasoning."},{"@type":"HowToStep","text":"Line tray with foil and baking / parchment paper. Place chicken upside down on tray. Drizzle chicken with about 1 tsp oil. Rub over with fingers. Sprinkle with Seasoning."},{"@type":"HowToStep","text":"Flip chicken. Drizzle with 1 tsp oil, rub with fingers, sprinkle with Seasoning, covering as much of the surface area as you can."},{"@type":"HowToStep","text":"Bake 18 minutes, or until surface is golden per photos and video, or internal temperature is 165°F/75°C using a meat thermometer."},{"@type":"HowToStep","text":"Remove from oven and immediately transfer chicken to serving plates."},{"@type":"HowToStep","text":"Wait 3 - 5 minutes before serving, garnished with freshly chopped parsley if desired. Pictured with a side of Garlic Butter Rice with Kale."}],"nutrition":{"@type":"NutritionInformation","servingSize":"158 g","calories":"286 kcal","carbohydrateContent":"4 g","proteinContent":"46 g","fatContent":"7 g","saturatedFatContent":"1 g","cholesterolContent":"127 mg","sodiumContent":"403 mg","sugarContent":"4 g","unsaturatedFatContent":"2 g"},"url":"https://www.recipetineats.com/oven-baked-chicken-breast/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
