<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/mexican-chicken-stew-quinoa-beans"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Mexican chicken stew with quinoa & beans","recipeYield":"5 servings","recipeIngredient":["1 tbsp olive oil","1 onion sliced","2 red peppers deseeded and chopped into largish chunks","3 tbsp chipotle paste","2 x 400g cans chopped tomatoes","4 skinless chicken breasts","140g quinoa","2 chicken stock cubes","1 x 400g can pinto beans drained","small bunch coriander most chopped, a few leaves left whole","juice 1 lime","1 tbsp sugar","natural yogurt to serve"],"recipeInstructions":[{"@type":"HowToStep","text":"Heat the oil in a deep frying pan and fry the onions and peppers for a few mins until softened. Stir in the chipotle paste for a minute, followed by the tomatoes. Add up to a tomato can-full of water to cover the chicken and bring to a gentle simmer. Add the chicken breasts and gently simmer, turning the chicken occasionally, for 20 mins until the chicken is cooked through."},{"@type":"HowToStep","text":"Bring a large saucepan of water to the boil with the stock cubes. Add the quinoa and cook for 15 mins until tender, adding the beans for the final min. Drain well and stir in the coriander and lime juice, then check for seasoning before covering to keep warm."},{"@type":"HowToStep","text":"Lift the chicken out onto a board and shred each breast using two forks. Stir back into the tomato sauce with the sugar and season. Serve with the quinoa, scattering the stew with some coriander leaves just before dishing up and eating with a dollop of yogurt on the side."}],"nutrition":{"@type":"NutritionInformation","calories":"336 calories","fatContent":"6 grams fat","saturatedFatContent":"0.9 grams saturated fat","carbohydrateContent":"34.7 grams carbohydrates","sugarContent":"15.8 grams sugar","fiberContent":"4.1 grams fiber","proteinContent":"33.4 grams protein","sodiumContent":"2.1 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/mexican-chicken-stew-quinoa-beans"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
