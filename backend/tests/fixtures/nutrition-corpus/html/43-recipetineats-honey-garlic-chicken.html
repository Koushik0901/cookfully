<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/honey-garlic-chicken/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Honey Garlic Chicken Breast","recipeYield":"4 servings","recipeIngredient":["500g / 1 lb chicken breast (, boneless and skinless (2 pieces))","Salt and pepper","1/4 cup flour (Note 1)","3 1/2 tbsp (50g) unsalted butter (or 2 1/2 tbsp olive oil)","2 garlic cloves (, minced)","1 1/2 tbsp apple cider vinegar (or white or other clear vinegar)","1 tbsp soy sauce (, light or all purpose (Note 2))","1/3 cup honey (or maple syrup)"],"recipeInstructions":[{"@type":"HowToStep","text":"Cut the breasts in half horizontally to create 4 steaks in total. Sprinkle each side with salt and pepper."},{"@type":"HowToStep","text":"Place flour in a shallow dish. Coat chicken in flour and shake off excess."},{"@type":"HowToStep","text":"Melt most of the butter in a large skillet over high heat - hold back about 1 tsp for later."},{"@type":"HowToStep","text":"Place chicken in skillet and cook for 2 - 3 minutes until golden. Turn and cook the other side for 1 minute."},{"@type":"HowToStep","text":"Turn heat down slightly to medium high."},{"@type":"HowToStep","text":"Make a bit of room in the pan and add garlic and top with remaining dab of butter. Stir garlic briefly once butter melts."},{"@type":"HowToStep","text":"Add vinegar, soy sauce and honey. Stir / shake pan to combine. Bring sauce to simmer, then simmer for 1 minute or until slightly thickened."},{"@type":"HowToStep","text":"Turn chicken to coat in sauce. If the sauce gets too thick, add a touch of water and stir."},{"@type":"HowToStep","text":"Remove from stove immediately. Place chicken on plates and drizzle over remaining sauce."}],"nutrition":{"@type":"NutritionInformation","servingSize":"166 g","calories":"323 kcal","carbohydrateContent":"23 g","proteinContent":"28 g","fatContent":"13 g","saturatedFatContent":"7 g","cholesterolContent":"107 mg","sodiumContent":"400 mg","sugarContent":"21 g"},"url":"https://www.recipetineats.com/honey-garlic-chicken/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
