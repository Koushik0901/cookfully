<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.skinnytaste.com/easy-bagel-recipe/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Easy Bagel Recipe","recipeYield":"4 servings","recipeIngredient":["1 cup unbleached all purpose flour, whole wheat or gluten-free mix* (5 oz in weight)","2 teaspoons baking powder (make sure it's not expired or it won't rise)","3/4 teaspoon kosher salt (use less if using table salt)","1 cup non-fat Greek yogurt (not regular yogurt, it will be too sticky (Stonyfield))","1 egg white or whole egg (beaten)","optional toppings:"],"recipeInstructions":[{"@type":"HowToStep","text":"Oven Method:"},{"@type":"HowToStep","text":"Preheat oven to 375F. Place parchment paper or a silpat on a baking sheet. If using parchment paper, spray with oil to avoid sticking."},{"@type":"HowToStep","text":"In a medium bowl combine the flour, baking powder and salt and whisk well. Add the yogurt and mix with a fork or spatula until well combined, it will look like small crumbles."},{"@type":"HowToStep","text":"Lightly dust flour on a work surface and remove dough from the bowl, knead the dough a few times until dough is tacky, but not sticky, about 15 turns (it should not leave dough on your hand when you pull away)."},{"@type":"HowToStep","text":"Divide into 4 equal balls. Roll each ball into 3/4-inch thick ropes and join the ends to form bagels. (or you can make a ball and poke a hole in the center then stretch it slightly)"},{"@type":"HowToStep","text":"Top with egg wash and sprinkle both sides with seasoning of your choice. Bake on the top rack of the oven for 25 minutes. Let cool at least 15 minutes before cutting."},{"@type":"HowToStep","text":"Air Fryer Method:"},{"@type":"HowToStep","text":"In a medium bowl combine the flour, baking powder and salt and whisk well. Add the yogurt and mix with a fork or spatula until well combined, it will look like small crumbles."},{"@type":"HowToStep","text":"Lightly dust flour on a work surface and remove dough from the bowl, knead the dough a few times until dough is tacky, but not sticky, about 20 turns (it should not leave dough on your hand when you pull away)."},{"@type":"HowToStep","text":"Divide into 4 equal balls. Roll each ball into 3/4-inch thick ropes and join the ends to form bagels."},{"@type":"HowToStep","text":"Top with egg wash and sprinkle both sides with seasoning of your choice."},{"@type":"HowToStep","text":"Preheat the air fryer 280F degrees. Transfer in batches without overcrowding and bake 15 to 16 minutes, or until golden. No need to turn. Let cool at least 15 minutes before cutting."}],"nutrition":{"@type":"NutritionInformation","servingSize":"1 bagel","calories":"152 kcal","carbohydrateContent":"26.5 g","proteinContent":"10 g","fatContent":"0.3 g","sodiumContent":"434 mg","fiberContent":"1 g","sugarContent":"2.5 g"},"url":"https://www.skinnytaste.com/easy-bagel-recipe/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
