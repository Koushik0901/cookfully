<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.bbcgoodfood.com/recipes/focaccia"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Focaccia","recipeYield":"12 servings","recipeIngredient":["500g strong bread flour plus extra for dusting","7g dried fast action yeast","2 tsp fine sea salt","5 tbsp olive oil plus extra for the tin and to serve","1 tsp flaky sea salt","¼ small bunch of rosemary sprigs picked"],"recipeInstructions":[{"@type":"HowToStep","text":"Tip the flour into a large mixing bowl. Mix the yeast into one side of the flour, and the fine salt into the other side."},{"@type":"HowToStep","text":"Then mix everything together, this initial seperation prevents the salt from killing the yeast."},{"@type":"HowToStep","text":"Make a well in the middle of the flour and add 2 tbsp oil and 350-400ml lukewarm water, adding it gradually until you have a slightly sticky dough (you may not need all the water)."},{"@type":"HowToStep","text":"Sprinkle the work surface with flour and tip the dough onto it, scraping around the sides of the bowl. Knead for 5-10 mins until your dough is soft and less sticky. Put the dough into a clean bowl, cover with a tea towel and leave to prove for 1 hr until doubled in size."},{"@type":"HowToStep","text":"Oil a rectangle, shallow tin (25 x 35cm). Tip the dough onto the work surface, then stretch it to fill the tin. Cover with a tea towel and leave to prove for another 35-45 mins."},{"@type":"HowToStep","text":"Heat the oven to 220C/200C fan/gas 7. Press your fingers into the dough to make dimples."},{"@type":"HowToStep","text":"Mix together 1½ tbsp olive oil, 1 tbsp water and the flaky salt and drizzle over the bread. Push sprigs of rosemary into the dimples in the dough."},{"@type":"HowToStep","text":"Bake for 20 mins until golden. Whilst the bread is still hot, drizzle over 1-2 tbsp olive oil. Cut into squares and serve warm or cold with extra olive oil, if you like."}],"nutrition":{"@type":"NutritionInformation","calories":"208 calories","fatContent":"7 grams fat","saturatedFatContent":"1 grams saturated fat","carbohydrateContent":"31 grams carbohydrates","fiberContent":"1 grams fiber","proteinContent":"5 grams protein","sodiumContent":"1.2 milligram of sodium"},"url":"https://www.bbcgoodfood.com/recipes/focaccia"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
