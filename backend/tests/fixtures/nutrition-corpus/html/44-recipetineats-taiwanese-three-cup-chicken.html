<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/taiwanese-three-cup-chicken/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Taiwanese Three Cup Chicken","recipeYield":"4 servings","recipeIngredient":["1 1/2 tbsp plain oil - canola (, vegetable, peanut)","600g/1.2 lb chicken thighs (, boneless, skinless, cut into 2.5cm/1\" pieces (Note 1))","6 slices ginger (, ~3mm / 1/8\" thick (Note 2))","1 1/2 tbsp finely minced garlic (, about 5 - 6 cloves (yes, lots!))","2 dried red chillies (barely noticeable spicy, but can omit, or sub 1/4 tsp dried chilli flakes)","1 1/2 tbsp toasted sesame oil","1 cup (lightly packed) Thai basil leaves","2 tbsp light soy (, or all-purpose soy (Note 4))","2 tsp dark soy (Note 4)","2 tsp white sugar","2 tbsp Chinese cooking wine (or Taiwanese rice wine (mijiu) if you can find it, or chicken stock/broth (Note 5))","White rice"],"recipeInstructions":[{"@type":"HowToStep","text":"ABBREVIATED RECIPE:"},{"@type":"HowToStep","text":"Toast ginger and chilli 30 sec, seal chicken, adding garlic towards end. Add sauce, braise 4 - 5 min until syrupy, stir in sesame oil and basil leaves. Serve!"},{"@type":"HowToStep","text":"FULL RECIPE"},{"@type":"HowToStep","text":"Sauce - Mix the ingredients in a small bowl and set aside."},{"@type":"HowToStep","text":"Seal chicken - Heat the oil in a non-stick pan over medium low. Add the ginger and chillies, stir for 30 seconds. Turn heat up to high, add chicken and stir until the surface is changes from pink to white, but it's still raw inside. Add the garlic and stir for another 30 seconds."},{"@type":"HowToStep","text":"Braise - Add sauce, making sure to scrape out all the sugar from the bowl. Stir, and once it starts bubbling, reduce the heat to medium high or medium so it's simmering fairly rapidly but not wildly - not too low else it will take ages to reduce, not too high else the sauce will reduce too quickly (if it does, add a splash of water). Simmer for 5 minutes, stirring to stain each piece of chicken all over with colour, until the sauce reduces and changes from watery to a thin syrup."},{"@type":"HowToStep","text":"Finish - Stir in the sesame oil, then the Thai Basil leaves until it wilts (~15 seconds). Serve over rice, making sure you use all the syrup in the pan! (It's intense, so you don't need much)"}],"nutrition":{"@type":"NutritionInformation","calories":"272 kcal","carbohydrateContent":"5 g","proteinContent":"26 g","fatContent":"16 g","saturatedFatContent":"2 g","transFatContent":"0.04 g","cholesterolContent":"119 mg","sodiumContent":"783 mg","fiberContent":"0.3 g","sugarContent":"2 g","unsaturatedFatContent":"12 g","servingSize":"1 serving"},"url":"https://www.recipetineats.com/taiwanese-three-cup-chicken/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
