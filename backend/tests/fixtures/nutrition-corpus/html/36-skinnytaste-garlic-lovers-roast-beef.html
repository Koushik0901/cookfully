<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.skinnytaste.com/garlic-lovers-roast-beef/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Garlic Lovers Roast Beef","recipeYield":"10 servings","recipeIngredient":["2-3 lb roast or eye round (all fat trimmed off)","3-4 cloves garlic (cut into thin slivers)","olive oil spray","kosher salt (to taste)","fresh cracked pepper (to taste)","2 tsp dried chopped rosemary","meat thermometer"],"recipeInstructions":[{"@type":"HowToStep","text":"Remove the roast from refrigerator 1 hour before cooking to reach room temperature. Trim all the fat off the meat. Using a sharp knife, pierce meat about 1/2-inch deep and insert slivers of garlic in each hole, pushing all the way in. Lightly spray the meat with olive oil and season generously with salt, pepper and rosemary. Place the thermometer all the way into the center of the meat."},{"@type":"HowToStep","text":"Preheat oven to 350F. When the oven reaches 350F, place the roast in a roasting pan and put in the oven."},{"@type":"HowToStep","text":"Roast until the thermometer reads 130° for rare, 140° for medium rare, 150° for medium, and 155-160° for well done. Remove the roast from the oven and let it rest 10-20 minutes before you cut it so that the juices distributed evenly. I personally remove my roast beef from the oven when it is 135° for medium rare. The temperature will rise an additional 5 degrees as it sits."},{"@type":"HowToStep","text":"Slice thin and serve."}],"nutrition":{"@type":"NutritionInformation","servingSize":"3 oz cooked","calories":"142.5 kcal","carbohydrateContent":"0.5 g","proteinContent":"24 g","fatContent":"4 g","cholesterolContent":"44 mg","sodiumContent":"292.5 mg","fiberContent":"0.5 g"},"url":"https://www.skinnytaste.com/garlic-lovers-roast-beef/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
