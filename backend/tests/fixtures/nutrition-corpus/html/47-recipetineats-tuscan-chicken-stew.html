<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="canonical" href="https://www.recipetineats.com/tuscan-chicken-stew/"><script type="application/ld+json">{"@context":"https://schema.org","@type":"Recipe","name":"Tuscan Chicken Stew","recipeYield":"4 servings","recipeIngredient":["600g / 1.2 lb chicken thighs (, boneless skinless (or breast), cut into large bite size pieces 3 - 4 cm / 1.2 - 1.4\" (Note 1))","1 1/2 tsp Italian herb mix (store bought mix, or see Note 2)","1/2 tsp garlic powder","1/2 tsp cooking salt / kosher salt (halve for table salt, +50% for flakes)","1/4 tsp black pepper","1 1/2 tbsp olive oil","1 onion (, halved and sliced into 1cm / 0.4\" wedges)","3 garlic cloves (, finely minced)","1/2 cup (100 g) sun dried tomatoes (, cut into 0.5cm / 0.2\" slices (Note 3))","200g (1 1/4 cups) cherry or grape tomatoes (1 punnet)","2 x 400g/14oz cans butter beans (large lima beans), drained - or cannellini, Great Northern or other white beans (Note 4)","1/3 cup Chardonnay or other dry white wine (, substitute chicken stock/broth (Note 5))","1/3 cup plain flour / all-purpose flour (Note 6 for gluten-free)","3 cups chicken stock / broth (, low sodium)","3/4 cup thickened cream / heavy cream (, or any full fat cream ~35% fat)","1/2 cup parmesan (, finely grated or store bought sandy-type - substitute with cheddar, tasty or other sharp cheese)","100g / 3.5oz baby spinach (, or a few big handfuls torn kale)"],"recipeInstructions":[{"@type":"HowToStep","text":"ABBREVIATED RECIPE"},{"@type":"HowToStep","text":"Season chicken, sear. Sauté onion and garlic. Deglaze with wine, stir in flour, then stock. Add beans and sun dried tomato, simmer 7 minutes. Add cream, parmesan and cherry tomatoes, simmer 8 minutes. Stir in spinach, serve!"},{"@type":"HowToStep","text":"FULL RECIPE"},{"@type":"HowToStep","text":"Season and sear chicken - Sprinkle chicken with the seasoning and toss to coat. Heat the oil on high in a 30 cm / 12\" non stick pan until very hot. (Note 7 re: cooking vessel) Add the chicken, spread it out, then leave it for 30 seconds or so until golden. Then start stirring, leaving it for 20 seconds every now and then to get colour on the pieces, until most of the pieces are light golden."},{"@type":"HowToStep","text":"Sauté onion - Lower heat to medium high. Add onion and garlic then cook for around 2 minutes until the onion is wilted."},{"@type":"HowToStep","text":"Deglaze and add flour - Turn the heat back up to high. Add the wine and let it simmer for 1 - 2 minutes until reduced by half. Add flour and stir until it is mixed in."},{"@type":"HowToStep","text":"Make sauce - Slow pour in a third of the stock, mixing as you go. The flour will make the liquid turn into a thick sauce quite quickly. Then add the rest of the stock, beans and sun dried tomato, and stir well."},{"@type":"HowToStep","text":"First simmer 7 minutes - Bring to a simmer. Lower heat to medium or medium high so it's simmering, not too rapidly. Simmer 7 minutes, stirring every now and then."},{"@type":"HowToStep","text":"Second simmer 8 minutes - Add cherry tomatoes, cream and parmesan. Mix and simmer for 8 minutes. The sauce should be reduced and thicken into a gravy consistency."},{"@type":"HowToStep","text":"Wilt spinach - Stir spinach in to make it wile (~ 30 seconds). Ladle into bowls, garnish with extra parmesan and chilli flakes if desired. Serve with warm crusty bread for dunking!"}],"nutrition":{"@type":"NutritionInformation","calories":"581 kcal","carbohydrateContent":"46 g","proteinContent":"40 g","fatContent":"26 g","saturatedFatContent":"12 g","transFatContent":"0.02 g","cholesterolContent":"163 mg","sodiumContent":"1127 mg","fiberContent":"11 g","sugarContent":"14 g","unsaturatedFatContent":"12 g","servingSize":"1 serving"},"url":"https://www.recipetineats.com/tuscan-chicken-stew/"}</script></head><body><p>Sanitized public-page recipe capture for deterministic testing.</p></body></html>
